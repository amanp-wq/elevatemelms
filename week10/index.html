<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevateMe · Week 10: Success on the Job</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        /* 30-60-90 day plan grid */
        .plan-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:1rem; }
        .plan-card { border-radius:14px; padding:1.2rem; border:1px solid #edf2f0; }
        .plan-card-header { display:flex; align-items:center; gap:0.7rem; margin-bottom:0.9rem; }
        .plan-card-icon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; color:white; }
        .plan-card h4 { font-size:0.9rem; font-weight:800; }
        .plan-card ul { list-style:none; padding:0; }
        .plan-card ul li { font-size:0.82rem; padding:0.3rem 0; border-bottom:1px solid #f5f5f5; color:#636e72; display:flex; gap:0.5rem; }
        .plan-card ul li:last-child { border-bottom:none; }
        .plan-card ul li::before { content:'→'; color:var(--brand-teal); font-size:0.75rem; flex-shrink:0; margin-top:1px; }
        @media(max-width:600px){ .plan-grid { grid-template-columns:1fr; } }
    </style>
<link rel="icon" type="image/png" href="/favicon.png"></head>
<body>

<nav class="navbar">
    <a class="logo-area" href="../"></a>
    <div class="nav-links">
        <span class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Mode</span>
        <a href="../">Dashboard</a>
        <a href="#" class="active">Week 10</a>
        <button onclick="changePassword()" class="btn-changepw"><i class="fas fa-key"></i> Change Password</button><a href="../" class="btn-accent">Student Portal</a>
    </div>
</nav>

<div class="week-shell">
    <aside class="week-sidebar">
        <div class="sidebar-header">
            <a href="../" class="sidebar-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <div class="sidebar-phase">Phase 10</div>
            <div class="sidebar-week-title">Week 10: Success on the Job</div>
        </div>
        <div class="sidebar-progress">
            <div class="sidebar-progress-label">
                <span>Progress</span>
                <strong class="week-pct" data-week="10">0%</strong>
            </div>
            <div class="progress-track"><div class="progress-fill week-fill" data-week="10"></div></div>
        </div>
        <nav class="sidebar-modules" id="weekSidebar"></nav>
        <div class="sidebar-nav">
            <button class="sidebar-nav-btn" id="w10-prev" onclick="navigateModule(10,-1)"><i class="fas fa-chevron-up"></i> Prev</button>
            <button class="sidebar-nav-btn" id="w10-next" onclick="navigateModule(10,1)">Next <i class="fas fa-chevron-down"></i></button>
        </div>
    </aside>
    <div class="week-content" id="weekContent"></div>
</div>

<div class="footer-hint">
    <span><i class="far fa-copyright"></i> ElevateMe</span>
    <span>Week 10 — Final Week 🎉</span>
</div>
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/app.js"></script>
<script src="../shared/curriculum.js"></script>
<script>
const MODULES = window.CURRICULUM[10];
buildWeekPage(10, MODULES);
</script>
</body>
</html>

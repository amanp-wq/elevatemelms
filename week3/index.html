        @media(max-width:600px){ .dual-video-wrap { grid-template-columns:1fr; } }

<script>
const MODULES = window.CURRICULUM[3];
buildWeekPage(3, MODULES);

/* ── Dual video injection for Pre-Interview Checklist (w3m2) ── */
// Wait for auth + video data to load before injecting dual videos
function injectDualVideos() {
    const mod = MODULES.find(m => m.isDualVideo);
    if (!mod) return;
    const panel = document.getElementById('panel-' + mod.id);
    if (!panel) return;
    const notesCard = panel.querySelector('.lesson-notes-card');
    if (!notesCard) return;

    // Skip if already injected
    if (document.getElementById('vwrap-' + mod.id + '-1')) return;

    const dualWrap = document.createElement('div');
    dualWrap.innerHTML = `
        <div class="dual-video-wrap">
            <div>
                <div class="dual-video-label"><i class="fas fa-play-circle"></i> Video 1 — Pre-Interview Checklist</div>
                <div class="lesson-video-wrap" id="vwrap-${mod.id}-1">
                    <div class="lesson-video-placeholder"><i class="fas fa-play-circle"></i><span>Video 1</span></div>
                </div>
            </div>
            <div>
                <div class="dual-video-label"><i class="fas fa-play-circle"></i> Video 2 — Common Misconceptions</div>
                <div class="lesson-video-wrap" id="vwrap-${mod.id}-2">
                    <div class="lesson-video-placeholder"><i class="fas fa-play-circle"></i><span>Video 2</span></div>
                </div>
            </div>
        </div>`;
    notesCard.parentNode.insertBefore(dualWrap, notesCard);

    function embedDualVideo(wrapId, url){
        const w = document.getElementById(wrapId);
        if (!w || !url) return;
        const embed = toEmbedUrl(url);
        if (embed.includes('youtube.com/embed')) {
            w.innerHTML = `<iframe src="${embed}&origin=${encodeURIComponent(location.origin)}" allowfullscreen allow="autoplay"></iframe>`;
        } else if (embed.includes('player.vimeo')) {
            w.innerHTML = `<iframe src="${embed}" allowfullscreen></iframe>`;
        } else if (embed.includes('drive.google.com')) {
            w.innerHTML = `<a href="${embed}" target="_blank" rel="noopener" class="video-link-btn"><i class="fas fa-play-circle"></i><span>Watch Video</span><small>Opens in new tab</small></a>`;
        } else {
            w.innerHTML = `<a href="${url}" target="_blank" rel="noopener" class="video-link-btn"><i class="fas fa-play-circle"></i><span>Watch Video</span><small>Opens in new tab</small></a>`;
        }
    }
    if (moduleVideoMap[mod.id]?.url) embedDualVideo('vwrap-' + mod.id + '-1', moduleVideoMap[mod.id].url);
    if (moduleVideoMap[mod.id]?.url2) embedDualVideo('vwrap-' + mod.id + '-2', moduleVideoMap[mod.id].url2);
}

// Poll until moduleVideoMap is populated (auth + loadModuleVideos complete)
let dualVideoAttempts = 0;
const dualVideoTimer = setInterval(() => {
    dualVideoAttempts++;
    if (moduleVideoMap['w3m2'] || dualVideoAttempts > 50) {
        clearInterval(dualVideoTimer);
        injectDualVideos();
    }
}, 100);

window.saveDualVideo = function(moduleId, num){
    const inp = document.getElementById('vid-input-' + moduleId + '-' + num);
    if (!inp || !inp.value.trim()){ showToast('Please paste a URL first'); return; }
    const url = inp.value.trim();
    const embed = toEmbedUrl(url);
    const wrap = document.getElementById('vwrap-' + moduleId + '-' + num);
    if (!wrap) return;
    if (embed.includes('youtube.com/embed')) {
        wrap.innerHTML = `<iframe src="${embed}&origin=${encodeURIComponent(location.origin)}" allowfullscreen allow="autoplay"></iframe>`;
    } else if (embed.includes('player.vimeo')) {
        wrap.innerHTML = `<iframe src="${embed}" allowfullscreen></iframe>`;
    } else if (embed.includes('drive.google.com')) {
        wrap.innerHTML = `<a href="${embed}" target="_blank" rel="noopener" class="video-link-btn"><i class="fas fa-play-circle"></i><span>Watch Video</span><small>Opens in new tab</small></a>`;
    } else {
        wrap.innerHTML = `<a href="${url}" target="_blank" rel="noopener" class="video-link-btn"><i class="fas fa-play-circle"></i><span>Watch Video</span><small>Opens in new tab</small></a>`;
    }
    showToast('Video ' + num + ' saved!');
};

window.clearDualVideo = function(moduleId, num){
    const wrap = document.getElementById('vwrap-' + moduleId + '-' + num);
    if (wrap) wrap.innerHTML = '<div class="lesson-video-placeholder"><i class="fas fa-play-circle"></i><span>Video ' + num + '</span></div>';
    const inp = document.getElementById('vid-input-' + moduleId + '-' + num);
    if (inp) inp.value = '';
    showToast('Video ' + num + ' removed');
};
</script>
</body>
